[package]
name = "showcase-fft"
version = "0.1.0"
edition = "2024"

[dependencies]
mimalloc = "0.1"

[lib]
name = "fft"
path = "src/lib.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[profile.release]
lto = true           # Enable Link Time Optimization (equivalent to -flto)
opt-level = 3        # Maximum optimization level
codegen-units = 1    # Single codegen unit for better optimization
panic = "abort"      # Reduce binary size
strip = true         # Strip debug symbols
